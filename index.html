var GD={
A1:["Gender is mostly arbitrary, so memorise der/die/das with each noun. The accusative (the object of the verb) only changes masculine: der Mann → den Mann, ein Mann → einen Mann. Feminine, neuter and plural stay the same.","Whatever comes first (time, subject, object), the verb stays 2nd: Heute lerne ich / Ich lerne heute. With a question word (Wo, Was, Wann) the verb is also 2nd: Was lernst du?","kein replaces ein or no article (Ich habe kein Auto). nicht goes after the verb (Ich komme nicht), before adjectives (nicht gut) and before what you deny (nicht heute)."],
A2:["Most verbs use haben. Use sein for movement (gehen, fahren, kommen), change of state (aufwachen, werden), and for sein and bleiben. The Partizip II usually starts with ge-.","The dative answers ‘to whom / for whom’: Ich gebe dem Mann das Buch. Articles: dem (m/n), der (f), den + -n (plural). Learn the verbs that always take it: helfen, danken, gefallen.","In a main clause the modal is 2nd and the infinitive goes last. Clauses with weil, dass or wenn send the conjugated verb to the end. Separable verbs split in main clauses but stay together in those clauses."],
B1:["Use Perfekt when speaking and Präteritum when writing a narrative. Weak verbs add -te (machte). Strong verbs change the stem (gehen → ging), so learn them as sets: sehen – sah – gesehen.","Find the noun, then ask what role the pronoun plays inside the clause. Der Mann, der kommt (subject: nominative). Der Mann, den ich sehe (object: accusative). Commas surround the clause.","Wishes, politeness and hypotheticals use Konjunktiv II. Common forms: wäre, hätte, könnte, würde + infinitive. Pattern: Wenn ich Zeit hätte, würde ich kommen.","The passive makes the doer unimportant: Das Haus wird gebaut. Past: wurde gebaut. Add von + dative only if the doer matters: von Arbeitern gebaut."],
B2:["Konjunktiv I is formal and written: er sei, sie habe, es gebe. It is mainly used for the 3rd person. When a form looks like the indicative, news writing switches to Konjunktiv II or würde.","Strong endings (-er, -e, -es, -en) show gender and case. After der/die/das the article already shows it, so the adjective takes weak -e or -en. After ein- the adjective must show it where the article doesn’t.","Turn a verb into a noun with -ung (entscheiden → Entscheidung) or use the infinitive as a neuter noun (lesen → das Lesen). Adjectives take -heit or -keit. The suffix decides the gender.","Modal passive: Das muss gemacht werden. The Zustandspassiv gives the resulting state: Die Tür ist geschlossen (it is closed now), unlike Die Tür wird geschlossen (someone is closing it)."],
C1:["Place the whole participle phrase between article and noun, with endings: der gestern gelieferte Tisch. Read it as a relative clause: der Tisch, der gestern geliefert wurde.","Genitive prepositions show up in formal texts. In speech people often use the dative (wegen dem Regen). Masculine and neuter genitive nouns add -(e)s: des Mannes.","These fixed phrases sound formal because the noun carries the meaning: zur Verfügung stellen instead of geben, in Betracht ziehen instead of überlegen. Learn them as chunks.","Particles soften or intensify: doch (contradiction or a friendly push), ja (shared knowledge), mal (softening), eben/halt (resignation), denn (curiosity in questions)."],
C2:["Register depends on the situation. Official: Ich bitte Sie … Neutral: Könnten Sie …? Casual: Kannst du mal …? Check the pronoun (Sie/du), verb forms and fixed phrases together.","Modals have a second meaning about certainty: muss = must be, dürfte = probably, kann = possibly, soll = reportedly, will = claims. They are used with an infinitive.","Idioms have fixed wording and grammar, so do not swap words. Learn the whole phrase with an example and note whether it is formal, informal or regional."]};

{t:"Conjugation step by step",i:"Conjugating means changing the verb so it matches who is acting. In German the ending shows the person.",d:"<b>Step 1.</b> Find the infinitive: <b>lernen</b> (to learn).<br><b>Step 2.</b> Remove -en to get the stem: <b>lern-</b>.<br><b>Step 3.</b> Add the ending for the person.<br><b>Extra e:</b> if the stem ends in -t or -d (arbeit-, find-), add an e before -st and -t so it can be pronounced: du arbeitest, er arbeitet.<br>Notice that wir and sie/Sie always look like the infinitive.",h:["Pronoun","Ending","lernen","arbeiten"],r:[["ich","-e","lerne","arbeite"],["du","-st","lernst","arbeitest"],["er/sie/es","-t","lernt","arbeitet"],["wir","-en","lernen","arbeiten"],["ihr","-t","lernt","arbeitet"],["sie/Sie","-en","lernen","arbeiten"]],s:"Stem + ending: -e, -st, -t, -en, -t, -en. wir and sie/Sie look like the infinitive. Add an extra e after stems ending in -t or -d.",p:"verb"},
{t:"Irregular present forms",i:"Many common verbs change their vowel, but only for du and er/sie/es. The other forms stay regular.",d:"Think of a boot shape: ich, wir, ihr and sie keep the normal stem, while du and er/sie/es change. The changes follow a few patterns, so once you know three you can predict many verbs. sein, haben and werden are fully irregular and must be memorised.",h:["Pattern","Verbs","Forms"],r:[["e → i","sprechen, geben, helfen","du sprichst, er gibt, er hilft"],["e → ie","sehen, lesen","du siehst, er liest"],["a → ä","fahren, schlafen, tragen","du fährst, er schläft"],["sein","to be","bin · bist · ist · sind · seid · sind"],["haben","to have","habe · hast · hat · haben · habt · haben"],["werden","to become","werde · wirst · wird · werden · werdet · werden"]],s:"Vowel changes apply to du and er/sie/es only. Patterns: e → i, e → ie, a → ä. Memorise sein, haben and werden.",p:"verb"});

{t:"Past forms of verbs",i:"German has a Partizip II (used in the Perfekt) and a Präteritum form. Both depend on whether a verb is weak (regular) or strong (irregular).",d:"<b>Weak:</b> machen → machte → gemacht. The pattern is stable.<br><b>Strong:</b> gehen → ging → gegangen. Learn the three forms as one set.<br><b>No ge-</b> after inseparable prefixes and in -ieren verbs: verstanden, telefoniert.<br><b>Separable</b> verbs put ge- in the middle: aufgestanden.",h:["Type","Infinitive","Präteritum","Partizip II"],r:[["Weak","machen","machte","gemacht"],["Strong","gehen","ging","gegangen"],["Strong","sehen","sah","gesehen"],["Mixed","bringen","brachte","gebracht"],["Inseparable","verstehen","verstand","verstanden"],["Separable","aufstehen","stand auf","aufgestanden"],["-ieren","telefonieren","telefonierte","telefoniert"]],s:"Weak: -te and ge-…-t. Strong: vowel change and ge-…-en. No ge- after inseparable prefixes or in -ieren verbs. Learn strong verbs as three-form sets.",p:"verb"},
{t:"Using each verb form",i:"Choosing a form depends on time, formality and attitude. Use this map.",d:"Spoken German relies on Präsens and Perfekt. Written narration relies on Präsens and Präteritum. Add Plusquamperfekt for something that happened before another past event, Konjunktiv II for politeness and imagination, and Imperativ for orders.",h:["Form","Use it to…","Example"],r:[["Präsens","talk about now, habits, facts, planned future","Morgen fahre ich ab."],["Perfekt","report finished events in speech","Ich habe es gesehen."],["Präteritum","tell a story, write a report; speak sein/haben/modals","Sie kam spät. Ich war müde."],["Plusquamperfekt","say something happened before another past event","Ich hatte gegessen, als er kam."],["Futur I","promise, predict, assume","Es wird regnen."],["Konjunktiv II","be polite, wish, imagine","Könnten Sie helfen? Wenn ich Zeit hätte …"],["Imperativ","give orders or advice (du: stem, ihr: -t, Sie: -en Sie)","Komm! Kommt! Kommen Sie!"],["Infinitive","follow modals and werden; goes to the end","Ich muss gehen."]],s:"Speak in Präsens + Perfekt, write in Präsens + Präteritum. Plusquamperfekt = earlier past. Konjunktiv II = polite or imagined. Imperativ = commands.",p:"tense"});
